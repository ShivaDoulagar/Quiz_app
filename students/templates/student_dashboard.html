<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="{{ url_for('static', filename='images/student.png') }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('students.static', filename='css/style.css') }}" />

    <title>{{ title }}</title>

    <style>
      .sidebar {
        background-color: #f8f9fa;
        border-right: 1px solid #dee2e6;
        min-height: 100vh;
      }

      .nav-link.active {
        font-weight: bold;
        background-color: #e9ecef;
        color: #0d6efd !important;
      }

      .nav-link:hover {
        background-color: #f1f1f1;
      }

      .main-content {
        padding: 2rem;
      }

      @media (max-width: 768px) {
        .main-content {
          padding: 1rem;
        }
      }

      .alert {
        position: absolute;
        top: 70px;
        right: 20px;
        max-width: 300px;
        z-index: 1050;
      }
    </style>
  </head>

  <body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #e3f2fd">
      <div class="container-fluid ps-3 gap-2">
        <!-- Sidebar toggle for mobile -->
        <button class="btn btn-outline-primary d-md-none me-2" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarToggle">
          ☰
        </button>

        <img src="{{ url_for('static', filename='images/student.png') }}" alt="logo" width="30" class="d-inline-block align-text-top" />
        <a class="navbar-brand" href="{{ url_for('students.student_dashboard', mail=mail) }}">Quiz Master</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
          <span class="navbar-text fw-bold me-3">Welcome {{ name|capitalize }}</span>
          <span>
            {% if 'user' in session %}
              <a class="navbar-brand" href="{{ url_for('logout') }}">
                <img src="{{ url_for('static', filename='images/logout.png') }}" width="30" alt="logout" />
              </a>
            {% else %}
              <a href="{{ url_for('signin') }}">Login</a>
            {% endif %}
          </span>
        </div>
      </div>
    </nav>

    <!-- Flash messages -->
    {% for message in get_flashed_messages() %}
      <div class="alert alert-primary alert-dismissible fade show m-3" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}

    <!-- Main Layout with Sidebar -->
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar (collapsible on mobile) -->
        <nav id="sidebarToggle" class="col-md-3 col-lg-2 d-md-block sidebar collapse show">
          <div class="position-sticky pt-3">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'students.student_dashboard' %}active{% endif %}" href="{{ url_for('students.student_dashboard', mail=mail) }}">
                  🏠 Home
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'students.scores' %}active{% endif %}" href="{{ url_for('students.scores', mail=mail) }}">
                  📊 Scores
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'students.summary' %}active{% endif %}" href="{{ url_for('students.summary', mail=mail) }}">
                  📋 Summary
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'sgpa.main' %}active{% endif %}" href="{{ url_for('sgpa.main', mail=mail) }}">
                  🎓 SGPA Calculators
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <!-- Main Content Area -->
        <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
          {% block content %}
          {% endblock %}
        </main>
      </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const viewButtons = document.querySelectorAll(".view-btn");

        viewButtons.forEach((button) => {
          button.addEventListener("click", function () {
            const quizId = button.getAttribute("data-id");
            const subject = button.getAttribute("data-subject");
            const chapter = button.getAttribute("data-chapter");
            const questions = button.getAttribute("data-questions");
            const date = button.getAttribute("data-date");
            const duration = button.getAttribute("data-duration");
            const quiz_title = button.getAttribute("data-quiz_title");

            document.getElementById("quiz-id").textContent = quizId;
            document.getElementById("quiz-title").textContent = quiz_title;
            document.getElementById("quiz-subject").textContent = subject;
            document.getElementById("quiz-chapter").textContent = chapter;
            document.getElementById("quiz-questions").textContent = questions;
            document.getElementById("quiz-date").textContent = date;
            document.getElementById("quiz-duration").textContent = duration;
          });
        });
      });

      function highlightSearch() {
        let input = document.getElementById("searchInput").value.trim().toLowerCase();
        let table = document.querySelector("table");
        let cells = table.getElementsByTagName("td");

        for (let cell of cells) {
          let text = cell.innerText;
          cell.innerHTML = text;
          if (input !== "" && text.toLowerCase().includes(input)) {
            let regex = new RegExp(`(${input})`, "gi");
            cell.innerHTML = text.replace(regex, `<span class="highlight">$1</span>`);
          }
        }
      }
    </script>
  </body>
</html>
