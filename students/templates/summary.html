{% extends "stu_dash.html" %}

{% block content %}
<div class="container mb-5">
    <div class="row justify-content-center">
        <!-- Subject Chart -->
        <div class="col-12 col-md-6 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="text-center">Subject-wise Quiz Attempts</h5>
                <canvas id="subjectChart"></canvas>
            </div>
        </div>

        <!-- Month Chart -->
        <div class="col-12 col-md-6 mb-4">
            <div class="card shadow-sm p-3">
                <h5 class="text-center">Monthly Quiz Attempts</h5>
                <canvas id="monthChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        fetch("/students/{{ mail }}/summary/api")  
            .then(response => response.json())
            .then(data => {
                const subjectLabels = data.subject_attempts.map(item => item[0]);
                const subjectValues = data.subject_attempts.map(item => item[1]);
                const monthLabels = Object.keys(data.monthly_attempts);
                const monthValues = Object.values(data.monthly_attempts);

                // Subject-wise Bar Chart
                new Chart(document.getElementById("subjectChart"), {
                    type: "bar",
                    data: {
                        labels: subjectLabels,
                        datasets: [{
                            label: "Number of Quizzes",
                            data: subjectValues,
                            backgroundColor: "#4CAF50"
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false }
                        }
                    }
                });

                // Month-wise Pie Chart
                new Chart(document.getElementById("monthChart"), {
                    type: "pie",
                    data: {
                        labels: monthLabels,
                        datasets: [{
                            data: monthValues,
                            backgroundColor: ["#ff9999", "#66b3ff", "#99ff99", "#ffcc99"]
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false
                    }
                });
            })
            .catch(error => console.error("Error fetching data:", error));
    });
</script>

<style>
    canvas {
        width: 100% !important;
        height: 300px !important;
    }
</style>
{% endblock %}
