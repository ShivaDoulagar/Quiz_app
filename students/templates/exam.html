
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    


<nav class="navbar navbar-expand-lg" style="background-color: #e3f2fd;" >
        
    <div class="container-fluid">
      <a class="navbar-brand" href="#">Quiz Master</a>
    </div>
  </nav>

<div class="container p-4 shadow-lg rounded bg-light">
    <form id="quiz-results">
        <div class="exam card p-3">
            <!-- Header -->
            <div class="header d-flex justify-content-between align-items-center bg-primary text-white p-3 rounded">
                <div></div>
                <div><h1>Quiz</h1></div>
                <div class="timer d-flex align-items-center">
                    <span class="me-2">Time remaining:</span>
                    <div class="timer bg-danger p-2 text-white rounded">
                        <span id="timer">Loading...</span>
                    </div>
                </div>
            </div>
            <div id="question-container" class="mt-3">
                <!-- Questions will be loaded here dynamically -->
            </div>

            <!-- Response Message -->
            <div id="response-message" class="mt-3 text-center"></div>

            <!-- Submit Button -->
            <div class="d-flex justify-content-start mt-3 mx-2">
                <button type="submit" class="btn btn-outline-primary">Submit</button>
            </div>
        </div>
    </form>
</div>

<!-- Link to external JavaScript -->
<script src="{{ url_for('students.static', filename='js/exam.js') }}"></script>

</body>
</html>
