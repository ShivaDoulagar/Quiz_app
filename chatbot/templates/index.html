<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master Chatbot</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1e1e1e;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent-primary: #7e57c2;
            --accent-secondary: #5e35b1;
            --bot-msg-bg: #2c2c2c;
            --user-msg-bg: #4a3880;
            --correct-color: #4caf50;
            --wrong-color: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #333;
        }

        h1 {
            font-size: 24px;
            font-weight: 600;
            background: linear-gradient(45deg, var(--accent-primary), #9575cd);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            0% {
                text-shadow: 0 0 5px rgba(126, 87, 194, 0.1);
            }
            100% {
                text-shadow: 0 0 15px rgba(126, 87, 194, 0.4);
            }
        }

        .toggle-theme {
            background-color: transparent;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #chat-box {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px 0;
            margin-bottom: 20px;
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar {
            width: 6px;
        }

        #chat-box::-webkit-scrollbar-track {
            background: var(--bg-secondary);
            border-radius: 10px;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: var(--accent-secondary);
            border-radius: 10px;
        }

        .message {
            display: flex;
            margin-bottom: 20px;
            align-items: flex-start;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .bot-msg {
            flex-direction: row;
        }

        .user-msg {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 15px;
            font-weight: bold;
            flex-shrink: 0;
        }

        .bot-avatar {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .user-avatar {
            background: linear-gradient(135deg, #64b5f6, #1976d2);
            color: white;
        }

        .message-content {
            padding: 15px;
            border-radius: 18px;
            max-width: 70%;
            position: relative;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .bot-msg .message-content {
            background-color: var(--bot-msg-bg);
            border-bottom-left-radius: 5px;
        }

        .user-msg .message-content {
            background-color: var(--user-msg-bg);
            border-bottom-right-radius: 5px;
        }

        #typing-indicator {
            display: none;
            margin: 10px 0;
            font-style: italic;
            color: var(--text-secondary);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 0.5;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.5;
            }
        }

        .input-area {
            position: relative;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        #chat-form {
            display: flex;
            width: 100%;
            position: relative;
            background-color: var(--bg-secondary);
            border-radius: 24px;
            padding: 5px;
        }

        #user-input {
            flex-grow: 1;
            padding: 15px 20px;
            border: none;
            background-color: transparent;
            color: var(--text-primary);
            font-size: 16px;
            outline: none;
        }

        #user-input::placeholder {
            color: var(--text-secondary);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(126, 87, 194, 0.4);
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 15px 0;
        }

        .quiz-option {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            padding: 12px 15px;
            border-radius: 10px;
            background-color: rgba(255, 255, 255, 0.05);
            transition: all 0.2s ease;
        }

        .quiz-option:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }

        .quiz-result {
            margin-top: 15px;
            padding: 15px;
            border-radius: 10px;
            background-color: rgba(0, 0, 0, 0.2);
            animation: fadeIn 0.5s;
        }

        .correct-answer {
            color: var(--correct-color);
            font-weight: bold;
        }

        .wrong-answer {
            color: var(--wrong-color);
            font-weight: bold;
        }

        .explanation {
            margin-top: 12px;
            font-style: italic;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        #clear-chat {
            background: linear-gradient(135deg, #ff7043, #f44336);
            color: white;
            margin-top: 10px;
            margin-left: auto;
            display: block;
        }

        #clear-chat:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(244, 67, 54, 0.4);
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }

            header {
                padding: 15px 0;
            }

            h1 {
                font-size: 20px;
            }

            .message-content {
                max-width: 85%;
            }

            .btn {
                padding: 10px 15px;
            }
        }

        @media (max-width: 480px) {
            .avatar {
                width: 30px;
                height: 30px;
                margin: 0 8px;
                font-size: 12px;
            }

            .message-content {
                max-width: 90%;
                padding: 12px;
            }

            .input-area {
                margin-bottom: 15px;
            }

            #user-input {
                padding: 12px 15px;
                font-size: 14px;
            }

            .btn {
                padding: 8px 12px;
                font-size: 14px;
            }
        }

        /* Animations */
        @keyframes ripple {
            0% {
                box-shadow: 0 0 0 0 rgba(126, 87, 194, 0.3);
            }
            100% {
                box-shadow: 0 0 0 20px rgba(126, 87, 194, 0);
            }
        }

        /* Light mode styles */
        body.light-mode {
            --bg-primary: #f5f5f5;
            --bg-secondary: #e0e0e0;
            --text-primary: #212121;
            --text-secondary: #757575;
            --bot-msg-bg: #e3f2fd;
            --user-msg-bg: #d1c4e9;
        }

        /* Custom scrollbar for entire page */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-secondary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Quiz Master Chatbot</h1>
            <button class="toggle-theme" id="toggle-theme">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                Toggle Theme
            </button>
        </header>

        <div id="chat-box">
            <div id="typing-indicator">Bot is typing...</div>
        </div>

        <form id="chat-form" class="input-area">
            <input type="text" id="user-input" placeholder="Type your message here..." autocomplete="off">
            <button type="submit" class="btn btn-primary">Send</button>
        </form>

        <button id="clear-chat" class="btn">Clear Chat</button>
    </div>

    <script src="{{ url_for('chatbot.static', filename='js/script.js') }}"></script>

    <!-- Added minimal script for theme toggle -->
    <script>
        document.getElementById('toggle-theme').addEventListener('click', function() {
            document.body.classList.toggle('light-mode');
            
            const themeIcon = this.querySelector('svg');
            if (document.body.classList.contains('light-mode')) {
                themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
            } else {
                themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
            }
        });
    </script>
</body>
</html>
