<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="{{url_for('static',filename='images/student.png')}}">
    <meta charset="UTF-8" />
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" href="{{url_for('static',filename = 'css/style.css')}}">
    <title>Quiz Master-login</title>

  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-dark">
      <div class="container-fluid ps-4 gap-3">
        <img src="{{url_for('static',filename='images/student.png')}}" alt="logo" width="30" height="24" class="d-inline-block align-text-top">
        <a class="navbar-brand fs-3 text-light" href="/">Quiz Master</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav"></div>
      </div>
    </nav>
    {% for message in get_flashed_messages()%}

    <div class="alert alert-secondary alert-dismissible fade show" role="alert">
      {{message}}
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>
    {%endfor%}
    <div class="loading">
      <div class="loader"></div>
    </div>
    
    <div class="body_of_sigin">
      {{added}}
      <div class="Signin_box rounded-1 shadow p-5">
        <h1 class="pb-4">Signin</h1>
        <form method="POST" action="/" style="background-color: whitesmoke;">
          {{form.hidden_tag()}}
        
          <!-- Email input with icon -->
          <label class="form-label">{{form.mail.label.text}}</label>
          <div class="input-group mb-3">
            <span class="input-group-text">
              <i class="bi bi-envelope-fill"></i> <!-- Bootstrap icon -->
            </span>
            {{form.mail(class="form-control mail")}}
          </div>
        
          <!-- Password input with icon and show/hide toggle -->
          <label class="form-label">{{form.password.label.text}}</label>
          <div class="input-group mb-4">
            <span class="input-group-text">
              <i class="bi bi-lock-fill"></i> <!-- Bootstrap icon -->
            </span>
            {{form.password(class="form-control password", id="password-input")}}
            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword()" tabindex="-1">
              <i id="toggle-icon" class="bi bi-eye"></i>
            </button>
          </div>
        
          <div class="d-flex flex-column align-items-center justify-content-center gap-3">
            <!-- {{form.submit(class="btn btn-secondary ps-4 pe-4 pt-2 pb-2", onclick="loading()")}} -->
            <button type="submit" class="submit" onclick="loading()">Login</button>
            <a style="color: black" href="/register">Register?</a>
          </div>
        </form>
        
      </div>
    </div>

    <script>
      function empty_the_inputs() {
        const inputs = document.querySelectorAll("input");
        inputs.forEach((input) => {
          input.value = "";
        });
      }
    function loading() {
    let load = document.querySelector('.loading');  
    let mail = document.querySelector(".mail").value;  
    let password = document.querySelector(".password").value;  
    console.log(mail, password); 
    if (mail != "" && password != ""){
      load.style.visibility = "visible";
    } 
    
}
function togglePassword() {
    const passwordInput = document.getElementById('password-input');
    const toggleIcon = document.getElementById('toggle-icon');

    if (passwordInput.type === "password") {
      passwordInput.type = "text";
      toggleIcon.classList.remove("bi-eye");
      toggleIcon.classList.add("bi-eye-slash");
    } else {
      passwordInput.type = "password";
      toggleIcon.classList.remove("bi-eye-slash");
      toggleIcon.classList.add("bi-eye");
    }
  }

    </script>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
