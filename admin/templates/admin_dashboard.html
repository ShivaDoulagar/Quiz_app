<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="icon" href="{{url_for('static',filename='images/teacher.png')}}">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/style.css') }}">
    <title>{{ title }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Bootstrap Bundle with Popper (includes Bootstrap JS and Popper.js) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <style>
      .sidebar {
        background-color: #f8f9fa;
        border-right: 1px solid #dee2e6;
      }
      .nav-link.active {
        font-weight: bold;
        color: #0d6efd !important;
        background-color: #e9ecef;
      }
      .nav-link:hover {
        background-color: #f1f1f1;
      }
      .main-content {
        padding: 2rem;
      }
      .alert {
        position: absolute;
        top: 70px;
        right: 20px;
        max-width: 300px;
        z-index: 1050;
      }
      @media (max-width: 768px) {
        .main-content {
          padding: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- Top Navbar -->
    <nav class="navbar navbar-expand-lg sticky-top" style="background-color: #e3f2fd;">
      <div class="container-fluid ps-3 gap-2">
        <button class="btn btn-outline-primary d-md-none me-2" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarToggle" aria-controls="sidebarToggle" aria-expanded="false" aria-label="Toggle sidebar">
          ☰
        </button>
        <img src="{{url_for('static',filename='images/teacher.png')}}" alt="logo" width="30" class="d-inline-block align-text-top">
        <a class="navbar-brand" href="/admin/">Quiz Master</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end" id="navbarSupportedContent">
          <span class="navbar-text fw-bold me-3">Welcome Admin</span>
          <span>
            {% if 'user' in session %}
              <a class="navbar-brand" href="{{ url_for('logout') }}">
                <img src="{{url_for('static',filename='images/logout.png')}}" width="30" alt="logout">
              </a>
            {% else %}
              <a href="{{ url_for('signin') }}">Login</a>
            {% endif %}
          </span>
        </div>
      </div>
    </nav>

<div class="position-fixed" style="top: 40px; right: 20px; z-index: 1050;">
  {% for message in get_flashed_messages() %}
    <div class="alert alert-primary alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
</div>


    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar (Collapsible for mobile) -->
        <nav id="sidebarToggle" class="col-md-3 col-lg-2 d-md-block sidebar collapse show">
          <div class="position-sticky pt-3">
            <ul class="nav flex-column">
              <li class="nav-item">
                <a class="nav-link {% if request.path.startswith('/admin/') %}active{% endif %}" href="{{ url_for('admin.list_of_subjects') }}">
                  🏠 Home
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.path.startswith('/admin/quiz') %}active{% endif %}" href="{{ url_for('admin.quiz') }}">
                  📝 Quiz
                </a>
              </li>
              <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'admin.summary' %}active{% endif %}" href="{{ url_for('admin.summary') }}">
                  📋 Summary
                </a>
              </li>
            </ul>
          </div>
        </nav>

        <!-- Main content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 main-content">
          {% block content %} {% endblock %}
        </main>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        var addChapterModal = document.getElementById("addchapter");
        if (addChapterModal) {
          addChapterModal.addEventListener("show.bs.modal", function (event) {
            var button = event.relatedTarget;
            var quizId = button.getAttribute("data-quizid");
            document.getElementById("quizIdInput").value = quizId;
          });
        }
      });
    </script>
  </body>
</html>
