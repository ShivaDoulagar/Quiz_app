<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/style.css') }}">

    <title>Admin-Dashboard</title>
    <style>
      nav {
        color: white;
      }
      .main {
        width: 100%;
        height: 90vh;
        /* background-color: #f4f4f4; */
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;
      }
      .alert {
        position: absolute;
        top: 70px; 
        right: 20px; 
        max-width: 300px; 
        margin: 0; 
        z-index: 1050; 
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg" style="background-color: #e3f2fd">
      <div class="container-fluid">
        <a class="navbar-brand" href="/admin/">Quiz Master</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="/admin/quiz"
                >Quiz</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="{{url_for('admin.summary')}}">Summary</a>
            </li>

            <li class="nav-item">
              {% if 'user' in session %}
              <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
              {% else %}
              <a href="{{ url_for('signin') }}">Login</a>
              {% endif %}
            </li>
          </ul>
          <form class="d-flex" role="search">
            <input
              class="form-control me-2"
              type="search"
              placeholder="Search"
              aria-label="Search"
            />
            <button class="btn btn-outline-success" type="submit">
              Search
            </button>
          </form>
          <span class="navbar-text ms-5 me-3"> Welcome Admin </span>
        </div>
      </div>
    </nav>
    {% for message in get_flashed_messages()%}

    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      {{message}}
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>
    {%endfor%}

    <div class="main">
      <div class="container mt-5">
        <div id="subjects-container" class="row g-4 mt-4">
          {% block content %} {% endblock %}
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
      var addChapterModal = document.getElementById("addchapter");
      addChapterModal.addEventListener("show.bs.modal", function (event) {
        var button = event.relatedTarget; // Button that triggered the modal
        var quizId = button.getAttribute("data-quizid"); // Get quiz ID
        document.getElementById("quizIdInput").value = quizId; // Set value in hidden input
      });
    });
    console.log("Hello")
    
      </script>
  </body>
</html>
